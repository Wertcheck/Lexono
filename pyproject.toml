[project]
name = "lexono"
version = "0.1.0"
description = "Konfigurierbare KI-gestuetzte Workflow-Plattform fuer eine Anwaltskanzlei (Prototyp)"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Proprietary" }
authors = [{ name = "Lexono Projekt" }]

# Bewusst minimal fuer Prompt 02-16 + Privacy-Architektur Schritt 1-4.
# Ab Schritt 5 (Claude-API-Anbindung) kommt das offizielle Anthropic-SDK
# hinzu - ausschliesslich fuer die Textproduktions-Schicht
# (ClaudeWritingProvider), niemals fuer lokale Analyse.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.2",
    "argon2-cffi>=23.1",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "watchdog>=4.0",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "pytesseract>=0.3.10",
    "pillow>=10.0",
    "openpyxl>=3.1",
    # Hart auf 0.7.4 + onnxruntime==1.20.1 gepinnt statt "fastembed>=0.4"
    # frei aufzuloesen: reale Legacy-Kanzlei-Hardware ohne AVX2 (getestet:
    # Intel i7-3720QM, Ivy Bridge) scheitert mit JEDER onnxruntime-Version
    # ab 1.21.0 beim Import ("DLL load failed... DLL-Initialisierungsroutine
    # ist fehlgeschlagen"), waehrend 1.20.1 dort nachweislich funktioniert
    # (echter Modell-Download + echte FastEmbed-Inferenz erfolgreich
    # getestet). fastembed==0.8.0 (die aktuellste, Python-3.13-faehige
    # Version) erzwingt fuer Python 3.13 selbst "onnxruntime>1.21.0" und
    # waere damit nur ueber einen versteckten "pip install --no-deps"-
    # Workaround mit 1.20.1 kombinierbar. fastembed==0.7.4 erklaert dagegen
    # fuer Python 3.13 "onnxruntime>1.20.0" - 1.20.1 erfuellt das direkt,
    # die Kombination ist ueber einen normalen "pip install -e ." OHNE
    # Sonderbehandlung auflösbar (kein --no-deps, kein zusaetzliches Tool).
    "fastembed==0.7.4",
    "onnxruntime==1.20.1",
    "anthropic>=0.40",
    # Lokale PII-Erkennung/-Anonymisierung (app/privacy/presidio_ner.py, §63
    # 20.08.) - laeuft komplett offline, keine Mandantendaten verlassen dabei
    # die Kanzlei-Maschine. presidio-anonymizer wird fuer API-Vollstaendigkeit
    # mitgefuehrt (Operator-/Ergebnistypen), die eigentliche Platzhalter-
    # Vergabe/Rekonstruktion bleibt aus Konsistenzgruenden beim bestehenden
    # app/privacy/pseudonymizer.py::Pseudonymizer (siehe Docstring dort).
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
    # Kein oberes Versionslimit: das deutsche Modell (siehe unten) wird
    # bewusst NICHT als fest verdrahtete Wheel-URL-Dependency gepinnt,
    # sondern per `python -m spacy download de_core_news_lg` installiert
    # (siehe README.md/Setup) - spaCys eigener Downloader loest dabei
    # automatisch die zur tatsaechlich installierten spacy-Version
    # kompatible Modellversion auf. Eine hart gepinnte alte Modell-Wheel-URL
    # (erster Versuch: de_core_news_lg-3.7.0) erzwang ueber deren eigene
    # Metadaten ein altes spacy<3.8, dessen thinc/blis-Abhaengigkeit auf
    # Python 3.13 nicht als Wheel verfuegbar ist und der Source-Build daran
    # scheitert (Cython-Fehler in blis) - deshalb dieser Ansatz.
    "spacy>=3.7",
    # HINWEIS (Folgepunkt, bewusst nicht Teil von §63): Das PyInstaller-Spec
    # (windows/lexono.spec) buendelt das spaCy-Modell noch nicht - fuer
    # den Windows-Installer-Build muss dort ein zusaetzlicher Daten-Include
    # ergaenzt werden, sonst fehlt das Modell im gepackten Build.
    # HTTP-Client fuer app/updater/checker.py (Update-Manifest-Abruf). War
    # zuvor nur unter [dev] gelistet (dort ueber FastAPIs eigenen
    # httpx-Bedarf fuer TestClient bereits vorhanden) - echter, bisher
    # unbemerkter Laufzeit-Bedarf, jetzt korrekt als Kernabhaengigkeit
    # gefuehrt, damit auch der PyInstaller-Build (windows/lexono.spec)
    # sie bundlet.
    "httpx>=0.27",
    # Natives Fensterfenster um den bestehenden Web-Stack (Prompt 46) - zieht
    # unter Windows automatisch "pythonnet" nach (eigenes Umgebungs-Marker
    # "sys_platform == 'win32'" in pywebviews eigenen Metadaten), das die
    # bereits auf der Zielmaschine vorhandene Edge-WebView2-Runtime per
    # .NET-Interop ansteuert - kein eigenes Chromium-Bundle noetig.
    "pywebview>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
# Nur fuer das Erzeugen des Windows-Installers (Prompt 36) benoetigt -
# bewusst getrennt von "dev", damit ein normaler Entwicklungs-/Testlauf
# PyInstaller nicht mitinstallieren muss.
build = [
    "pyinstaller>=6.10",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
